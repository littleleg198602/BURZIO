[project]
name = "news-impact-yahoo"
version = "0.1.0"
description = "Analyze Yahoo Finance news phrase impact on stock price movement without trading signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "feedparser>=6.0.11",
    "openpyxl>=3.1.2",
    "streamlit>=1.35",
    "pandas>=1.3",
]

[project.scripts]
news-impact-yahoo = "src.main:main"
news-impact-yahoo-ui = "src.streamlit_launcher:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
